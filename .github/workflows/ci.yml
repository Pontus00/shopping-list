name: CI/CD Workflow

on:
  workflow_dispatch:
    inputs:
      customInput:
        description: 'Custom input for manual runs'
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build & Test (.NET ${{ matrix.dotnet }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet: [8.0.x, 9.0.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Build
        id: build
        run: dotnet build --no-restore

      - name: Run Unit Tests (only if build succeeded)
        if: steps.build.outcome == 'success'
        run: dotnet test --no-build

      - name: Context Info
        run: |
          if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
            echo "🔔 **PR Context**"
            echo "PR Number: ${{ github.event.pull_request.number }}"
            echo "Author:    ${{ github.event.pull_request.user.login }}"
            echo "Source:    ${{ github.event.pull_request.head.ref }}"
            echo "Target:    ${{ github.event.pull_request.base.ref }}"
          elif [[ "${{ github.event_name }}" == 'push' ]]; then
            echo "📦 **Push Context**"
            echo "Commit:    ${{ github.event.head_commit.message }}"
            echo "Author:    ${{ github.event.head_commit.author.name }}"
            echo "Files:"
            for file in ${{ join(github.event.commits.*.added, ',') }}; do
              echo "  - $file"
            done
            for file in ${{ join(github.event.commits.*.modified, ',') }}; do
              echo "  - $file"
            done
          elif [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            echo "🖐️ **Manual Run Context**"
            echo "Started by: ${{ github.actor }}"
            echo "Custom Input: ${{ inputs.customInput }}"
          else
            echo "Unknown context: ${{ github.event_name }}"
          fi
        shell: bash
        # On Windows, we fallback to PowerShell
        if: ${{ runner.os == 'Windows' }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            Write-Host "🔔 **PR Context**"
            Write-Host "PR Number: $env:GITHUB_EVENT_PULL_REQUEST_NUMBER"
            Write-Host "Author:    $env:GITHUB_EVENT_PULL_REQUEST_USER_LOGIN"
            Write-Host "Source:    $env:GITHUB_EVENT_PULL_REQUEST_HEAD_REF"
            Write-Host "Target:    $env:GITHUB_EVENT_PULL_REQUEST_BASE_REF"
          } elseif ($env:GITHUB_EVENT_NAME -eq 'push') {
            Write-Host "📦 **Push Context**"
            Write-Host "Commit:    $env:GITHUB_EVENT_HEAD_COMMIT_MESSAGE"
            Write-Host "Author:    $env:GITHUB_EVENT_HEAD_COMMIT_AUTHOR_NAME"
            Write-Host "Files:"
            foreach ($file in $env:GITHUB_EVENT_COMMITS_ADDED) { Write-Host "  - $file" }
            foreach ($file in $env:GITHUB_EVENT_COMMITS_MODIFIED) { Write-Host "  - $file" }
          } elseif ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            Write-Host "🖐️ **Manual Run Context**"
            Write-Host "Started by: $env:GITHUB_ACTOR"
            Write-Host "Custom Input: $env:INPUTS_CUSTOMINPUT"
          } else {
            Write-Host "Unknown context: $env:GITHUB_EVENT_NAME"
          }
        shell: pwsh
        if: ${{ runner.os == 'Windows' }}
        
          
          
          
          






