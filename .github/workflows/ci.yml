name: CI/CD yml Workflow

on:
  workflow_dispatch:
    inputs:
      customInput:
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build & Test (.NET ${{ matrix.dotnet }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet: [8.0.x, 9.0.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        id: build
        run: dotnet build --no-restore

      - name: Run Unit Tests (only if build succeeded)
        if: steps.build.outcome == 'success'
        run: dotnet test --no-build
        
        
    
  jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Smart Context Intelligence
        shell: bash
      
        run: |
          echo "### Kontextinformation"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            echo "PR-nummer: ${PR_NUMBER}"
            echo "Författare: ${PR_AUTHOR}"
            echo "Källa: ${PR_HEAD}"
            echo "Mål: ${PR_BASE}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            echo "Commit-meddelande: ${COMMIT_MESSAGE}"
            echo "Författare: ${COMMIT_AUTHOR}"
            echo "Branch: ${BRANCH}"
            if [[ -n "${ADDED}" || -n "${MODIFIED}" || -n "${REMOVED}" ]]; then
              echo "Filändringar:"
              echo "  Lagt till: ${ADDED}"
              echo "  Ändrat: ${MODIFIED}"
              echo "  Tagit bort: ${REMOVED}"
            fi
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Startare: ${ACTOR}"
            echo "Custom input: ${CUSTOM_INPUT}"
          fi
      
        
          
          
          
          






