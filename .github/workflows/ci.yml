name: CI/CD yml Workflow

on:
  workflow_dispatch:
    inputs:
      customInput:
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build & Test (.NET ${{ matrix.dotnet }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet: [8.0.x, 9.0.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        id: build
        run: dotnet build --no-restore

      - name: Run Unit Tests (only if build succeeded)
        if: steps.build.outcome == 'success'
        run: dotnet test --no-build
        
        
      - name: Smart Context Intelligence
        run: |
         echo "### Kontextinformation"
         if [[ "${{ github.event_name }}" == 'pull_request' ]]; then
         echo "PR-nummer: ${{ github.event.number }}"
         echo "Författare: ${{ github.event.pull_request.user.login }}"
         echo "Källa: ${{ github.event.pull_request.head.ref }}"
         echo "Mål: ${{ github.event.pull_request.base.ref }}"
         elif [[ "${{ github.event_name }}" == 'push' ]]; then
         echo "Commit-meddelande: ${{ github.event.commits[0].message }}"
         echo "Författare: ${{ github.event.commits[0].author.name }}"
         echo "Branch: ${{ github.ref }}"
         if [[ -n "${{ github.event.commits[0].added }}" || -n "${{ github.event.commits[0].modified }}" || -n "${{ github.event.commits[0].removed }}" ]]; then
         echo "Filändringar:"
          echo "  Lagt till: ${{ toJson(github.event.commits[0].added) }}"
          echo "  Ändrat: ${{ toJson(github.event.commits[0].modified) }}"
          echo "  Tagit bort: ${{ toJson(github.event.commits[0].removed) }}"
         fi
         elif [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
         echo "Startare: ${{ github.actor }}"
         echo "Custom input: ${{ github.event.inputs.customInput }}"
         fi
        shell: bash

      
        
          
          
          
          






