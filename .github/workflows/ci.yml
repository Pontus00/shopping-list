name: CI/CD yml Workflow

on:
  workflow_dispatch:
    inputs:
      customInput:
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test:
    name: Build & Test (.NET ${{ matrix.dotnet }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        dotnet: [8.0.x, 9.0.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build
        id: build
        run: dotnet build --no-restore

      - name: Run Unit Tests (only if build succeeded)
        if: steps.build.outcome == 'success'
        run: dotnet test --no-build

      # Context intelligence for Pull Requests
      - name: Context Intelligence (PR)
        shell: bash
        if: github.event_name == 'pull_request'
        run: |
          echo "### Kontextinformation för Pull Request"
          echo "- **PR-nummer:** ${{ github.event.pull_request.number }}"
          echo "- **Author:** ${{ github.event.pull_request.user.login }}"
          echo "- **Source Branch:** `${{ github.event.pull_request.head.ref }}`"
          echo "- **Target Branch:** `${{ github.event.pull_request.base.ref }}`"
          {
            echo "### Kontextinformation för Pull Request"
            echo "- **PR-nummer:** ${{ github.event.pull_request.number }}"
            echo "- **Author:** ${{ github.event.pull_request.user.login }}"
            echo "- **Source Branch:** `${{ github.event.pull_request.head.ref }}`"
            echo "- **Target Branch:** `${{ github.event.pull_request.base.ref }}`"
          } >> $GITHUB_STEP_SUMMARY

      # Context intelligence for Push
      - name: Context Intelligence (Push)
        if: github.event_name == 'push'
        run: |
          echo "### Kontextinformation för Push"
          echo "- **Commit message:** ${{ github.event.head_commit.message }}"
          echo "- **Author:** ${{ github.event.head_commit.author.name }} (${{ github.event.head_commit.author.username }})"
          echo "- **Changed files:**"
          if [ -n "${{ github.event.head_commit.added }}" ]; then
            echo "  + Added: ${{ join(github.event.head_commit.added, ', ') }}"
          fi
          if [ -n "${{ github.event.head_commit.modified }}" ]; then
            echo "  + Modified: ${{ join(github.event.head_commit.modified, ', ') }}"
          fi
          if [ -n "${{ github.event.head_commit.removed }}" ]; then
            echo "  + Removed: ${{ join(github.event.head_commit.removed, ', ') }}"
          fi

          {
            echo "### Kontextinformation för Push"
            shell: bash
            echo "- **Commit message:** ${{ github.event.head_commit.message }}"
            echo "- **Author:** ${{ github.event.head_commit.author.name }} (${{ github.event.head_commit.author.username }})"
            echo "- **Changed files:**"
            if [ -n "${{ github.event.head_commit.added }}" ]; then
              echo "  + Added: ${{ join(github.event.head_commit.added, ', ') }}"
            fi
            if [ -n "${{ github.event.head_commit.modified }}" ]; then
              echo "  + Modified: ${{ join(github.event.head_commit.modified, ', ') }}"
            fi
            if [ -n "${{ github.event.head_commit.removed }}" ]; then
              echo "  + Removed: ${{ join(github.event.head_commit.removed, ', ') }}"
            fi
          } >> $GITHUB_STEP_SUMMARY

      # Context intelligence for Manual/dispatch
      - name: Context Intelligence (Manuell)
        shell: bash
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "### Kontextinformation för Manuell körning"
          echo "- **Startad av:** ${{ github.actor }}"
          echo "- **Inputs:**"
          echo "  - customInput: '${{ github.event.inputs.customInput }}'"
          {
            echo "### Kontextinformation för Manuell körning"
            echo "- **Startad av:** ${{ github.actor }}"
            echo "- **Inputs:**"
            echo "  - customInput: '${{ github.event.inputs.customInput }}'"
          } >> $GITHUB_STEP_SUMMARY
          
        
          
          
          
          






